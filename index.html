<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1e42" />
  <meta name="description" content="Servers list and stats for FiveM Transport Tycoon server" />
  <meta name="color-scheme" content="light dark" />
  <meta name="darkreader-lock" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preload" href="/josefinsans.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://api.transporttycoon.eu" crossorigin />
  <link rel="preconnect" href="https://s1.transporttycoon.eu" crossorigin />
  <link rel="preconnect" href="https://s2.transporttycoon.eu" crossorigin />
  <script type="text/javascript">
    (function () {
      const f = url => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        return fetch(url, { credentials: "omit", signal: controller.signal })
          .then(r => (r.ok ? r.json() : null))
          .catch(() => null)
          .finally(() => clearTimeout(timeout));
      };
      window.preloadedData = {
        "s1.transporttycoon.eu": f("https://s1.transporttycoon.eu/status/widget/players.json"),
        "s2.transporttycoon.eu": f("https://s2.transporttycoon.eu/status/widget/players.json")
      };
    })();
  </script>
  <link rel="preload" href="https://d.ttstats.eu/skillboost" as="fetch" crossorigin="anonymous" />
  <title>TTSTATS | Transport Tycoon Server Browser</title>
  <style>
    body {
      background-color: rgb(19, 19, 19);
    }
  </style>
</head>

<body class="dark">
  <div id="main"></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script type="text/javascript">
    // if (window.location.host.includes('ttstats.')) {
    setTimeout(() => {
      window.ybug_settings = { id: '16bd61hfh8p9cc4ft97d' };
      const ybug = document.createElement('script');
      ybug.async = true;
      ybug.src = `https://widget.ybug.io/button/${window.ybug_settings.id}.js`;
      document.head.appendChild(ybug);
    }, 1000);

  </script>
</body>

</html>
